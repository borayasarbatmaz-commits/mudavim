<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#C2410C" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="Müdavim — aradığın ürünü mahallende bul." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>Müdavim</title>
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <header class="topbar">
      <form class="search" id="searchForm" autocomplete="off">
        <i data-lucide="search"></i>
        <input id="q" type="search" enterkeyhint="search" placeholder="Ne arıyorsun? beyran, cıvata, mavi A4…" />
        <button type="button" class="icon-btn clear" id="qClear" aria-label="Temizle" hidden><i data-lucide="x"></i></button>
      </form>
      <button class="avatar-btn" id="meBtn" aria-label="Profil"></button>
    </header>
    <div class="chips" id="quickChips"></div>
    <div class="suggest" id="suggest" hidden></div>

    <div class="fabs" id="fabs">
      <button class="fab" id="fabLocate" aria-label="Konumum"><i data-lucide="locate-fixed"></i></button>
      <button class="fab accent" id="fabHelp" aria-label="Yardım iste"><i data-lucide="hand-helping"></i></button>
    </div>

    <section class="sheet" id="sheet" data-state="hidden">
      <div class="sheet-handle" id="sheetHandle"><span></span></div>
      <div class="sheet-body" id="sheetBody"></div>
    </section>

    <nav class="tabbar" id="tabbar">
      <button data-tab="explore" class="on"><i data-lucide="map"></i><span>Keşfet</span></button>
      <button data-tab="help"><i data-lucide="hand-helping"></i><span>Yardım</span><b class="dot" id="helpDot" hidden></b></button>
      <button data-tab="board"><i data-lucide="trophy"></i><span>Müdavimler</span></button>
      <button data-tab="profile"><i data-lucide="user"></i><span>Profil</span></button>
    </nav>

    <div id="pages"></div>
    <div id="navui" hidden></div>
    <div id="arui" hidden></div>
    <div id="toasts"></div>
    <div id="boot" class="boot">
      <div class="boot-logo">M</div>
      <div class="boot-title">Müdavim</div>
      <div class="boot-sub" id="bootMsg">Mahalle yükleniyor…</div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
